<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maáyans Hörna - Kontakt</title>
  </head>

  <body>
    <header>
      <h1>Maáyans Hörna</h1>
      <nav>
        <ul style="list-style-type: &quot;❤️&quot;">
          <li><a href="index.html">Hem</a></li>
          <li><a href="hobby.html">Hobby</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Kontakta mig</h2>
      <p>
        Nyfiken på att veta mer eller har några funderingar? Fyll i
        kontaktformuläret nedan så hör jag av mig!
      </p>
      <form>
        <div>
          <label for="name">Namn</label>
          <input id="name" type="text" required />
        </div>
        <br />

        <div>
          <label for="email">E-post</label>
          <input id="email" type="email" required />
        </div>
        <br />

        <div>
          <label for="text">Ämne</label>
          <br />
          <textarea
            id="text"
            spellcheck="true"
            required
            rows="5"
            cols="50"
            placeholder="Skriv ditt meddelande här"
          ></textarea>
        </div>

        <br />
        <button type="submit">Skicka</button>
      </form>
      <p>
        Du kan också kontakta mig på
        <a href="mailto:magr1910@student.miun.se">magr1910@student.miun.se</a>
        :)
      </p>
    </main>
    <footer>
      <p>&copy; 2026 Maáyan</p>
      <a href="kontakt.html">Kontakt</a>
    </footer>
